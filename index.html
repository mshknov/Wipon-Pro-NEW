<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wipon Pro — прибор, подписка и вопросы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="nav">
    <button class="pill" data-toast="Возврат на предыдущий экран">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Назад
    </button>
    <h1>Wipon Pro</h1>
    <button class="pill info" id="guideBtn" aria-controls="faqBody">ГИД</button>
  </header>

  <main>
    <!-- Акцизка -->
    <section class="card" aria-labelledby="h-akc">
      <div class="sec-title" id="h-akc">Акцизка</div>
      <button class="item" data-need="pro" data-toast="Открывается камера для сканирования марки">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4v4l2 3v12a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9l2-3z"/><path d="M8 13h8"/></svg>
        <span class="label">Сканировать акцизную марку</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        <svg class="lk" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Доступно по подписке" role="img"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>
      <div class="sep"></div>
      <button class="item" data-need="pro" data-sheet="manual">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
        <span class="label">Проверка вручную</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        <svg class="lk" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Доступно по подписке" role="img"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>
    </section>

    <!-- Маркировка -->
    <section class="card" aria-labelledby="h-mark">
      <div class="sec-title" id="h-mark">Маркировка</div>
      <button class="item" data-need="plus" data-toast="Открывается сканер кодов маркировки">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M18 18h3v3"/></svg>
        <span class="label">Приемка маркированного товара</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        <svg class="lk" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Доступно по подписке" role="img"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>
      <div class="sep"></div>
      <button class="item" data-need="plus" data-sheet="accepted">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>
        <span class="label">Принятые маркированные товары</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        <svg class="lk" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Доступно по подписке" role="img"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>
    </section>

    <!-- Подписка и оплата -->
    <section class="card" aria-labelledby="h-sub" style="padding-bottom:6px">
      <div class="row-between" style="padding:14px 18px 6px">
        <span id="h-sub" style="font-size:17px;font-weight:700">Подписка и оплата</span>
        <span class="badge" id="statusText">Прибор активен</span>
      </div>
      <div class="nosub" id="noSubNote" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <span>Подписка не оформлена. Выберите тариф, чтобы сканировать акцизные марки и принимать маркированный товар.</span>
      </div>
      <div id="termBlock" style="padding:6px 18px 12px;flex-direction:column;gap:8px">
        <div class="row-between">
          <span class="muted" style="font-size:15px">Срок подписки</span>
          <span style="font-size:15px">осталось <b id="daysLeft">—</b> дней</span>
        </div>
        <div class="bar" role="progressbar" aria-label="Использовано срока подписки" aria-valuemin="0" aria-valuemax="100"><div id="barFill" style="width:0"></div></div>
      </div>
      <div class="summary">
        <div class="row-between"><span class="k">Лицевой счёт</span>
          <button class="acct-btn" id="copyAcct" aria-label="Скопировать номер лицевого счёта"><span class="v" id="acctNum">—</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          </button>
        </div>
        <div class="row-between"><span class="k">Баланс</span><span class="v balance" id="balance">—</span></div>
        <span class="hint" id="balHint" style="text-align:right"></span>
        <div style="height:1px;background:#DDE3EE;margin:2px 0"></div>
        <div class="row-between plan-static">
          <span class="k">Подписка</span>
          <span class="plan-val"><span class="v" id="planName">—</span><span class="plan-price" id="planPrice">—</span></span>
        </div>
      </div>
      <div style="padding:14px 18px 10px">
        <button class="primary" id="mainBtn" data-sheet="renew">Продлить подписку</button>
      </div>
      <button class="item" data-sheet="method">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
        <span class="label">Способ оплаты</span>
        <span class="val" id="methodVal">Kaspi</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <div id="autoRow" hidden>
      <div class="sep"></div>
      <div class="item" style="cursor:default">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
        <span class="label" id="lbl-auto">Автопродление</span>
        <button class="switch" id="autoSwitch" role="switch" aria-checked="true" aria-labelledby="lbl-auto"></button>
      </div>
      </div>
      <div class="sep"></div>
      <button class="item" data-sheet="history">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
        <span class="label">История платежей</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <div class="sep"></div>
      <button class="item" data-sheet="invoice">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>
        <span class="label">Счёт на оплату для ТОО / ИП</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </section>

    <!-- ТОП-10 вопросов: drop down -->
    <section class="card">
      <button class="faq-head" id="faqToggle" aria-expanded="false" aria-controls="faqBody">
        <span style="flex:1">
          <span class="t">Wipon Pro ГИД</span>
          <span class="h" id="faqHint">Нажмите, чтобы открыть список</span>
        </span>
        <span class="round"><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
      </button>
      <div class="collapse" id="faqBody">
        <div>
          <div id="faqList"></div>
          <div style="border-top:1px solid var(--line);padding:12px 18px 14px">
            <button class="secondary" data-sheet="support">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>
              Не нашли ответ? Написать в поддержку
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Баннер -->
    <section class="banner">
      <div style="flex:1">
        <h2>Подключить кассу с НКТ, маркировкой и акцизкой</h2>
        <button data-sheet="lead">Оставить заявку</button>
      </div>
      <svg width="96" height="110" viewBox="0 0 96 110" aria-hidden="true"><rect x="10" y="8" width="70" height="40" rx="14" fill="#F07A2A"/><rect x="62" y="16" width="14" height="24" rx="5" fill="#3A3A40"/><path d="M30 44h30l-6 58a6 6 0 0 1-6 5H40a6 6 0 0 1-6-5z" fill="#26262B"/><rect x="40" y="52" width="8" height="12" rx="3" fill="#F07A2A"/></svg>
    </section>
  </main>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/app.js"></script>
</body>
</html>
